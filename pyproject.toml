[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcdl"
version = "0.1.0"
description = "Bandcamp Collection Downloader"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
bcdl = "bcdl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
